[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faceveil"
version = "0.1.0"
description = "Local desktop camera filters and experimental face anonymization"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.8,<7", "opencv-python>=4.10,<5", "numpy>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pytest-qt>=4.4,<5"]

[project.gui-scripts]
faceveil = "faceveil.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
